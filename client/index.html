<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO Meta Tags ───────────────────────────────────────────────── -->

    <meta name="description"
      content="Honey Kumari is a Full Stack Developer and BCA graduate from Bengaluru, specializing in React.js, Node.js, PostgreSQL, and RESTful APIs. Open to exciting opportunities." />

      content="Honey Kumari, Full Stack Developer, React Developer, Node.js Developer, BCA, Bengaluru, Portfolio, JavaScript, PostgreSQL" />
    <meta name="author" content="Honey Kumari" />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph / Facebook ─────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Honey Kumari | Full Stack Developer" />
    <meta property="og:description" content="Explore Honey Kumari's portfolio — Full Stack Developer building modern web applications with React, Node.js, and PostgreSQL." />
    <meta property="og:url"         content="https://honeykumari.dev" />

    <!-- ── Twitter Card ──────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />

    <!-- ── Canonical ─────────────────────────────────────────────────── -->

    <!-- ── Google Fonts ──────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Theme: prevent flash of wrong mode -->
    <script>
      (function () {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
